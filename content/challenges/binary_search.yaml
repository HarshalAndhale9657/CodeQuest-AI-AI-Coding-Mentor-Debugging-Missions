id: binary_search
type: build
tier: 4
title: "Binary Search"
concepts: {primary: binary_search, secondary: [loops]}
traps: [off_by_one, empty_input, infinite_loop]
function: binary_search
description: |
  `nums` is sorted in increasing order. Return the index of `target` in `nums`, or -1 if it is
  not there. Your solution should halve the search range each step.
edge_cases:
  - an empty list
  - the target at the very first or very last position
  - a target that is missing
starter_code: |
  def binary_search(nums, target):
      pass
