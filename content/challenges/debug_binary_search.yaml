id: debug_binary_search
type: debug
tier: 4
title: "Debug Mission: The Elusive Boundary"
concepts: {primary: binary_search, secondary: [loops]}
traps: [off_by_one, boundary]
function: binary_search
max_changed_lines: 2
description: |
  This binary search implementation attempts to find `target` in sorted list `nums`, returning its index
  or -1 if not found. However, the search loop uses `lo < hi` instead of `lo <= hi`, missing targets located
  when the search narrows to a single element.
  Fix the bug by changing at most 2 lines.
edge_cases:
  - single element list containing the target
  - target at the very last index
  - target not present
starter_code: |
  def binary_search(nums, target):
      lo, hi = 0, len(nums) - 1
      while lo < hi:
          mid = (lo + hi) // 2
          if nums[mid] == target:
              return mid
          elif nums[mid] < target:
              lo = mid + 1
          else:
              hi = mid - 1
      return -1
