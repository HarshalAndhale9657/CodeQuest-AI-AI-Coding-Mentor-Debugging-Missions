id: max_window_sum
type: build
tier: 4
title: "Maximum Window Sum"
concepts: {primary: sliding_window, secondary: [lists]}
traps: [window_off_by_one, negatives, empty_input]
function: max_window_sum
description: |
  Given a list of numbers `nums` and an integer `k`, return the maximum sum of any contiguous
  subarray of length `k`. If `k <= 0` or `k > len(nums)` or `nums` is empty, return 0.
edge_cases:
  - k equals length of nums
  - k is larger than length of nums
  - all elements negative
starter_code: |
  def max_window_sum(nums, k):
      pass
tests:
  - {id: v1, visibility: visible, args: [[2, 1, 5, 1, 3, 2], 3], expected: 9, tags: [typical]}
  - {id: v2, visibility: visible, args: [[2, 3, 4, 1, 5], 2], expected: 7, tags: [typical]}
  - {id: v3, visibility: visible, args: [[1, 2], 5], expected: 0, tags: [boundary]}
  - {id: h1, visibility: hidden, args: [[], 1], expected: 0, tags: [empty]}
  - {id: h2, visibility: hidden, args: [[5], 1], expected: 5, tags: [single]}
  - {id: h3, visibility: hidden, args: [[-2, -5, -1, -8], 2], expected: -6, tags: [negative]}
  - {id: h4, visibility: hidden, args: [[1, 4, 2, 10, 23, 3, 1, 0, 20], 4], expected: 39, tags: [large]}
  - {id: h5, visibility: hidden, args: [[4, 2, 1, 7, 8, 1, 2, 8, 1, 0], 3], expected: 16, tags: [boundary]}
references:
  - |
    def max_window_sum(nums, k):
        if not nums or k <= 0 or k > len(nums):
            return 0
        window = sum(nums[:k])
        best = window
        for i in range(k, len(nums)):
            window += nums[i] - nums[i - k]
            if window > best:
                best = window
        return best
  - |
    def max_window_sum(nums, k):
        if not nums or k <= 0 or k > len(nums):
            return 0
        return max(sum(nums[i:i + k]) for i in range(len(nums) - k + 1))
# Domain for the counterexample finder (bounded small-input search, smallest first)
small_inputs:
  nums: {kind: list_int, values: [-1, 0, 2, 5], max_len: 4}
  k: {kind: int, values: [1, 2, 3]}
