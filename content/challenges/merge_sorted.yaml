id: merge_sorted
type: build
tier: 4
title: "Merge Two Sorted Lists"
concepts: {primary: two_pointers, secondary: [lists]}
traps: [leftover_tail, empty_input, off_by_one]
function: merge_sorted
description: |
  Given two sorted lists of integers `a` and `b` in non-decreasing order, return a new list
  containing all elements from both lists merged in non-decreasing order.
edge_cases:
  - one or both lists empty
  - lists of different lengths
  - duplicates across both lists
starter_code: |
  def merge_sorted(a, b):
      pass
tests:
  - {id: v1, visibility: visible, args: [[1, 3, 5], [2, 4, 6]], expected: [1, 2, 3, 4, 5, 6], tags: [typical]}
  - {id: v2, visibility: visible, args: [[], [1, 2]], expected: [1, 2], tags: [empty]}
  - {id: v3, visibility: visible, args: [[1], []], expected: [1], tags: [empty]}
  - {id: h1, visibility: hidden, args: [[], []], expected: [], tags: [empty]}
  - {id: h2, visibility: hidden, args: [[2, 2, 2], [2, 2]], expected: [2, 2, 2, 2, 2], tags: [duplicates]}
  - {id: h3, visibility: hidden, args: [[-5, -1, 3], [-4, 0, 10]], expected: [-5, -4, -1, 0, 3, 10], tags: [negative]}
  - {id: h4, visibility: hidden, args: [[1, 2, 3, 4, 5], [10, 20]], expected: [1, 2, 3, 4, 5, 10, 20], tags: [boundary]}
  - {id: h5, visibility: hidden, args: [[100], [1, 2, 3, 4, 5]], expected: [1, 2, 3, 4, 5, 100], tags: [large]}
references:
  - |
    def merge_sorted(a, b):
        res = []
        i, j = 0, 0
        while i < len(a) and j < len(b):
            if a[i] <= b[j]:
                res.append(a[i])
                i += 1
            else:
                res.append(b[j])
                j += 1
        res.extend(a[i:])
        res.extend(b[j:])
        return res
  - |
    def merge_sorted(a, b):
        return sorted(a + b)
