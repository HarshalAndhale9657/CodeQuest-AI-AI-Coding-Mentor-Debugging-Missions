id: debug_average
type: debug
tier: 1
title: "Debug Mission: The Broken Average"
concepts: {primary: loops, secondary: [lists]}
traps: [off_by_one, empty_input]
function: average
max_changed_lines: 3
description: |
  This function should return the average of `nums` (0.0 for an empty list), but it has bugs.
  Find them and fix the code by changing at most 3 lines.
edge_cases:
  - an empty list
  - the last element
starter_code: |
  def average(nums):
      total = 0
      for i in range(len(nums) - 1):
          total += nums[i]
      return total / len(nums)
small_inputs:
  nums: {kind: list_int, values: [-1, 0, 2, 4], max_len: 3}
tests:
  - {id: v1, visibility: visible, args: [[2, 4, 6]], expected: 4.0, tags: [typical]}
  - {id: v2, visibility: visible, args: [[10]], expected: 10.0, tags: [single]}
  - {id: v3, visibility: visible, args: [[]], expected: 0.0, tags: [empty]}
  - {id: h1, visibility: hidden, args: [[1, 2]], expected: 1.5, tags: [boundary]}
  - {id: h2, visibility: hidden, args: [[5, 5, 5, 5]], expected: 5.0, tags: [duplicates]}
  - {id: h3, visibility: hidden, args: [[-3, 3]], expected: 0.0, tags: [negative]}
  - {id: h4, visibility: hidden, args: [[100, 0, 50, 25, 75, 60, 40, 80, 20, 10]], expected: 46.0, tags: [large]}
references:
  - |
    def average(nums):
        if not nums:
            return 0.0
        total = 0
        for i in range(len(nums)):
            total += nums[i]
        return total / len(nums)
